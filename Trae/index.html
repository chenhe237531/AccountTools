<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trae 切号器</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --border:#e4e7ee; --border-2:#d3d8e3;
    --text:#1e2430; --muted:#667085; --faint:#98a2b3;
    --accent:#2f6fed; --accent-strong:#1d4ed8; --accent-dim:rgba(47,111,237,.08); --accent-line:rgba(47,111,237,.35);
    --ok:#0f9d58; --ok-dim:rgba(15,157,88,.08);
    --danger:#dc2626; --danger-dim:rgba(220,38,38,.07);
    --warn:#b45309; --warn-dim:rgba(180,83,9,.08);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 380px at 88% -12%,rgba(47,111,237,.06),transparent 62%),
      radial-gradient(760px 340px at -8% 108%,rgba(15,157,88,.05),transparent 62%),
      var(--bg);
    color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1120px;margin:0 auto;padding:28px 24px 64px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,#2f6fed,#5b8def);
    display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(47,111,237,.6);
  }
  .brand h1{font-size:19px;font-weight:700;letter-spacing:.3px}
  .brand p{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .btn{
    appearance:none;border:1px solid var(--border-2);background:var(--panel);color:var(--text);
    font:inherit;border-radius:9px;padding:8px 16px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .05s,box-shadow .15s;
    box-shadow:var(--shadow);
  }
  .btn:hover{border-color:var(--accent-line);background:var(--panel-2)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.danger{border-color:#f0c4c4;color:var(--danger)}
  .btn.danger:hover{border-color:var(--danger);background:var(--danger-dim)}
  .btn.small{padding:5px 12px;border-radius:7px;font-size:12.5px}

  /* ---------- segmented profile switch ---------- */
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border-2);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
  .seg button{
    appearance:none;border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);
    padding:6px 15px;border-radius:7px;cursor:pointer;transition:.15s;font-weight:500;
  }
  .seg button.on{background:var(--accent-dim);color:var(--accent-strong);font-weight:600}
  .seg button:not(.on):hover{background:var(--panel-2);color:var(--text)}

  /* ---------- current bar ---------- */
  .current-bar{
    display:flex;align-items:center;gap:26px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .current-bar .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-dim)}
  .current-bar .dot.off{background:var(--faint);box-shadow:0 0 0 3px rgba(152,162,179,.12)}
  .kv{display:flex;flex-direction:column;gap:1px}
  .kv .k{font-size:10.5px;color:var(--faint);letter-spacing:1px;text-transform:uppercase}
  .kv .v{font-family:var(--mono);font-size:14px;font-weight:600}
  .kv .v.sans{font-family:var(--sans)}
  .tagline{color:var(--faint);font-size:12px;margin-left:auto;text-align:right;line-height:1.5}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:20px;padding:2px 10px;font-weight:600}
  .pill.run{background:var(--ok-dim);color:var(--ok);border:1px solid rgba(15,157,88,.3)}
  .pill.stop{background:rgba(152,162,179,.1);color:var(--muted);border:1px solid var(--border-2)}

  .banner{border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
  .banner.warn{background:var(--warn-dim);border:1px solid rgba(180,83,9,.28);color:var(--warn)}
  .banner.err{background:var(--danger-dim);border:1px solid rgba(220,38,38,.28);color:var(--danger)}
  .banner.info{background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--accent-strong)}

  /* ---------- layout ---------- */
  .cols{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media(max-width:880px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .panel-head{
    display:flex;align-items:center;gap:8px;padding:13px 18px;
    border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;
    letter-spacing:1.2px;text-transform:uppercase;font-weight:600;background:var(--panel-2);
  }
  .panel-head .count{
    margin-left:auto;font-family:var(--mono);color:var(--accent);background:var(--accent-dim);
    border-radius:20px;padding:1px 10px;font-size:11.5px;letter-spacing:0;text-transform:none;
  }

  /* ---------- cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:15px 16px;display:flex;flex-direction:column;gap:10px;
    transition:border-color .15s,box-shadow .15s,transform .15s;
  }
  .card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow)}
  .card.active{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-dim),#fff 60%)}
  .card-top{display:flex;align-items:center;gap:8px}
  .card-top .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .who{font-size:12.5px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10.5px;border-radius:20px;padding:1px 9px;letter-spacing:.3px;flex:none;font-weight:600}
  .badge.now{background:var(--accent-dim);color:var(--accent-strong);border:1px solid var(--accent-line)}
  .badge.stale{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(180,83,9,.28)}
  .badge.expired{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(220,38,38,.28)}
  .card .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .card .meta .row{display:flex;gap:6px}
  .card .meta .row .lab{color:var(--faint);min-width:52px}
  .card .meta b{color:var(--text);font-weight:500}
  .card .foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:2px}
  .card .mtime{font-size:11px;color:var(--faint)}
  .empty{padding:46px 20px;text-align:center;color:var(--faint);font-size:13px;grid-column:1/-1}
  .empty b{color:var(--muted);display:block;margin-bottom:4px;font-size:14px}

  /* ---------- side ---------- */
  .side{display:flex;flex-direction:column;gap:18px}
  .form-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  label{font-size:12.5px;color:var(--muted)}
  input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);
    font:inherit;font-family:var(--mono);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .check input{accent-color:var(--accent)}
  .hint{font-size:11.5px;color:var(--faint);line-height:1.55}
  .paths{padding:12px 18px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .paths div{font-size:10.5px;color:var(--faint);word-break:break-all;font-family:var(--mono)}
  .paths div b{color:var(--muted);font-weight:600;font-family:var(--sans);font-size:11px;display:block;margin-bottom:1px}

  /* ---------- log ---------- */
  .log-wrap{margin-top:20px}
  .log{
    background:#fbfcfd;border-top:1px solid var(--border);
    padding:14px 18px;max-height:280px;overflow-y:auto;
    font-family:var(--mono);font-size:11.5px;display:flex;flex-direction:column;gap:9px;
  }
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .log-entry .head{display:flex;gap:10px;color:var(--faint)}
  .log-entry .head .cmd{color:var(--accent-strong);font-weight:600}
  .log-entry .head .ok{color:var(--ok)}
  .log-entry.fail .head .cmd{color:var(--danger)}
  .log-entry.fail .head .ok{color:var(--danger)}
  .log-entry .out{white-space:pre-wrap;color:var(--muted);padding-left:0;margin-top:1px}
  .log-empty{color:var(--faint);text-align:center;padding:18px 0}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,26,38,.42);backdrop-filter:blur(2px);display:none;place-items:center;z-index:50;padding:20px}
  .overlay.show{display:grid}
  .modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--border-2);border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px -18px rgba(16,24,40,.4);animation:pop .16s ease}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:16px;margin-bottom:10px}
  .modal p{color:var(--muted);font-size:13px;margin-bottom:7px}
  .modal p:last-of-type{margin-bottom:0}
  .modal code{font-family:var(--mono);color:var(--text);background:var(--panel-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-size:12px}
  .modal .warnbox{background:var(--warn-dim);border:1px solid rgba(180,83,9,.28);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:12px}
  .modal .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  /* ---------- toast ---------- */
  #toast{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel);border:1px solid var(--border-2);border-left:3px solid var(--ok);border-radius:10px;padding:10px 16px;font-size:13px;max-width:370px;box-shadow:0 12px 32px -12px rgba(16,24,40,.3);animation:slide .2s ease}
  .toast.fail{border-left-color:var(--danger)}
  @keyframes slide{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}

  .busy{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
    </div>
    <div class="brand">
      <h1>Trae 切号器</h1>
      <p>登录态快照交换 · 退出→写回→重启 · 本地控制台</p>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="seg">
      <button data-p="cn">Trae CN</button>
      <button data-p="intl">Trae 国际版</button>
    </div>
    <button class="btn" id="refreshBtn" onclick="refresh()">
      <svg style="vertical-align:-3px;margin-right:5px" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>刷新
    </button>
  </header>

  <div id="banners"></div>

  <section class="current-bar">
    <span class="dot" id="curDot"></span>
    <div class="kv"><span class="k">当前账号</span><span class="v sans" id="curName">—</span></div>
    <div class="kv"><span class="k">userId</span><span class="v" id="curUid">—</span></div>
    <div class="kv"><span class="k">区域 / 套餐</span><span class="v" id="curRegion">—</span></div>
    <div class="kv"><span class="k">accessToken 剩余</span><span class="v" id="curExp">—</span></div>
    <div class="tagline" id="curTag">
      <span class="pill stop" id="runPill">检测中…</span>
    </div>
  </section>

  <div class="cols">
    <section class="panel">
      <div class="panel-head">账号快照<span class="count" id="snapCount">0</span></div>
      <div class="cards" id="cards"></div>
    </section>

    <div class="side">
      <section class="panel">
        <div class="panel-head">保存当前账号</div>
        <div class="form-body">
          <div>
            <label for="snapName">快照名称</label>
            <input type="text" id="snapName" placeholder="如：主号 / 小号" maxlength="32" style="margin-top:5px">
          </div>
          <label class="check"><input type="checkbox" id="forceSave">覆盖同名快照</label>
          <button class="btn primary" id="saveBtn" onclick="doSave()">保存为快照</button>
          <div class="hint">把当前登录账号的 4 类认证键整组存入快照目录（权限 600）。同名已存在时需勾选覆盖。</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">维护</div>
        <div class="form-body">
          <button class="btn danger" id="restartBtn" onclick="doRestart()">重启 Trae</button>
          <div class="hint">Trae 主进程只在启动时读取一次 <code>storage.json</code>，因此切换必须重启才生效。重启前请先保存编辑器中的文件。</div>
        </div>
        <div class="paths">
          <div><b>会话文件</b><span id="pStorage">—</span></div>
          <div><b>快照目录</b><span id="pSnap">—</span></div>
        </div>
      </section>
    </div>
  </div>

  <section class="panel log-wrap">
    <div class="panel-head">操作日志</div>
    <div class="log" id="log">
      <div class="log-empty" id="logEmpty">暂无操作记录 —— 页面动作与 trae_switch.py 的真实输出会显示在这里</div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="row">
      <button class="btn" onclick="closeModal(false)">取消</button>
      <button class="btn primary" id="mOk">确认</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
let PROFILE = 'cn';
let STATE = null;
let modalResolve = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(ts * 1000), p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function daysLeft(iso){
  if(!iso) return null;
  const t = Date.parse(iso);
  if(isNaN(t)) return null;
  return (t - Date.now()) / 86400000;
}
function fmtDays(d){
  if(d === null) return '—';
  if(d < 0) return '已过期';
  if(d < 1) return Math.max(0, Math.round(d*24)) + ' 小时';
  return d.toFixed(1) + ' 天';
}
function toast(msg, fail){
  const el = document.createElement('div');
  el.className = 'toast' + (fail ? ' fail' : '');
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 3600);
}
function addLog(cmd, output, ok){
  $('logEmpty')?.remove();
  const e = document.createElement('div');
  e.className = 'log-entry' + (ok ? '' : ' fail');
  const t = new Date(), p = n => String(n).padStart(2,'0');
  e.innerHTML = `<div class="head"><span>[${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}]</span>`
    + `<span class="cmd">$ trae-switch ${esc(cmd)}</span><span class="ok">${ok?'✓ 成功':'✗ 失败'}</span></div>`
    + (output ? `<div class="out">${esc(output)}</div>` : '');
  $('log').appendChild(e);
  $('log').scrollTop = $('log').scrollHeight;
}

/* ---------- modal ---------- */
function confirmModal({title, body, okText}){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = body;
  $('mOk').textContent = okText || '确认';
  $('overlay').classList.add('show');
  return new Promise(r => { modalResolve = r; });
}
function closeModal(v){
  $('overlay').classList.remove('show');
  if(modalResolve){ modalResolve(v); modalResolve = null; }
}
$('mOk').onclick = () => closeModal(true);
$('overlay').addEventListener('click', e => { if(e.target === $('overlay')) closeModal(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(false); });

/* ---------- render ---------- */
function render(){
  const s = STATE;
  const banners = [];
  if(s.error) banners.push(`<div class="banner err">读取状态失败：${esc(s.error)}</div>`);
  if(s.current && !s.current.decoded) banners.push(`<div class="banner warn">当前账号信息未能解密（storage.json 结构可能已随版本变化），仍可正常保存与切换快照。</div>`);
  banners.push(`<div class="banner info">切换流程：退出 Trae → 回存当前账号 → 写入目标登录态 → 重新启动。整个过程约 5~15 秒，请先保存编辑器中的文件。</div>`);
  $('banners').innerHTML = banners.join('');

  const c = s.current;
  $('curName').textContent = c ? (c.username || '(未解析)') : '未登录';
  $('curUid').textContent  = c ? (c.userId || '—') : '—';
  $('curRegion').textContent = c ? `${c.region || '—'} / ${c.plan || '—'}` : '—';
  $('curExp').textContent  = c ? fmtDays(daysLeft(c.expiredAt)) : '—';
  $('curDot').className = 'dot' + (c ? '' : ' off');
  $('pStorage').textContent = s.storagePath || '—';
  $('pSnap').textContent = s.snapDir || '—';
  $('runPill').className = 'pill ' + (s.running ? 'run' : 'stop');
  $('runPill').textContent = s.running ? 'Trae 运行中' : 'Trae 未运行';

  const snaps = s.snapshots || [];
  $('snapCount').textContent = snaps.length;
  const box = $('cards');
  if(!snaps.length){
    box.innerHTML = `<div class="empty"><b>还没有快照</b>先在 Trae 中登录一个账号，再在右侧「保存当前账号」建立第一个快照。<br>再登录另一个账号并保存，即可在两个账号间一键切换。</div>`;
    return;
  }
  box.innerHTML = snaps.map(sn => {
    const exp = daysLeft(sn.refreshExpiredAt);
    let badge = '';
    if(sn.active) badge = '<span class="badge now">当前账号</span>';
    else if(exp !== null && exp < 0) badge = '<span class="badge expired">refreshToken 已过期</span>';
    else if(exp !== null && exp < 7) badge = `<span class="badge stale">${fmtDays(exp)}后过期</span>`;
    const contact = sn.email || sn.phone || '';
    return `
      <div class="card${sn.active ? ' active' : ''}">
        <div class="card-top">
          <span class="name" title="${esc(sn.name)}">${esc(sn.name)}</span>
          ${badge}
        </div>
        <div class="who" title="${esc(sn.username)}">${esc(sn.username || '(未解析)')}</div>
        <div class="meta">
          <div class="row"><span class="lab">userId</span><b>${esc(sn.userId || '—')}</b></div>
          <div class="row"><span class="lab">区域</span><b>${esc(sn.region || '—')}</b> · <b>${esc(sn.plan || '—')}</b></div>
          ${contact ? `<div class="row"><span class="lab">账号</span><b>${esc(contact)}</b></div>` : ''}
          <div class="row"><span class="lab">at 剩余</span><b>${esc(fmtDays(daysLeft(sn.expiredAt)))}</b></div>
        </div>
        <div class="foot">
          <button class="btn small primary" ${sn.active ? 'disabled' : ''}
                  onclick="doSwitch('${esc(sn.name).replace(/'/g,"&#39;")}')">
            ${sn.active ? '使用中' : '切换到此账号'}
          </button>
          <button class="btn small danger" ${sn.active ? 'disabled' : ''}
                  onclick="doDelete('${esc(sn.name).replace(/'/g,"&#39;")}')"
                  title="删除此快照" style="padding:5px 10px">
            ✕
          </button>
          <span class="mtime">存于 ${fmtTime(sn.savedAt)}</span>
        </div>
      </div>`;
  }).join('');
}

async function refresh(){
  try{
    const r = await fetch('/api/state?profile=' + encodeURIComponent(PROFILE));
    STATE = await r.json();
    render();
  }catch(e){
    toast('获取状态失败：' + e.message, true);
  }
}

/* ---------- actions ---------- */
async function api(path, body){
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({profile: PROFILE}, body || {}))
  });
  return await r.json();
}

async function doSwitch(name){
  const sn = (STATE.snapshots || []).find(x => x.name === name);
  const ok = await confirmModal({
    title: `切换到「${name}」？`,
    body: `<p>目标账号：<code>${esc(sn ? (sn.username || sn.userId) : '')}</code></p>
           <p>userId <code>${esc(sn ? sn.userId : '?')}</code> · 区域 <code>${esc(sn ? sn.region : '?')}</code></p>
           <p>切换会先把当前账号自动回存为快照，再写入目标登录态。</p>
           <div class="warnbox">Trae 必须先退出再重新启动才能使新登录态生效，当前窗口将被关闭（约 5~15 秒）。<b>请先保存编辑器中的文件。</b></div>`,
    okText: '退出并切换'
  });
  if(!ok) return;
  await withBusy(null, async () => {
    const btn = $('refreshBtn'); btn.disabled = true;
    const res = await api('/api/switch', {name, relaunch: true});
    addLog(`switch ${name}`, res.output, res.ok);
    toast(res.ok ? `已切换到「${name}」，Trae 正在重启` : '切换失败，详见日志', !res.ok);
    btn.disabled = false;
    await refresh();
  });
}

async function doSave(){
  const name = $('snapName').value.trim();
  if(!name){ toast('请先输入快照名称', true); $('snapName').focus(); return; }
  const force = $('forceSave').checked;
  if(force){
    const ok = await confirmModal({
      title: '覆盖已有快照？',
      body: `<p>将用当前会话覆盖名为 <code>${esc(name)}</code> 的快照，原快照内容会被替换。</p>`,
      okText: '覆盖保存'
    });
    if(!ok) return;
  }
  await withBusy($('saveBtn'), async () => {
    const res = await api('/api/save', {name, force});
    addLog(`save ${name}${force ? ' --force' : ''}`, res.output, res.ok);
    toast(res.ok ? `快照「${name}」已保存` : '保存失败，详见日志', !res.ok);
    if(res.ok){ $('snapName').value = ''; $('forceSave').checked = false; }
    await refresh();
  });
}

async function doRestart(){
  const ok = await confirmModal({
    title: '重启 Trae？',
    body: '<p>将退出并重新打开 Trae。</p><div class="warnbox">请先保存编辑器中的文件。</div>',
    okText: '重启'
  });
  if(!ok) return;
  await withBusy($('restartBtn'), async () => {
    const res = await api('/api/restart', {});
    addLog('restart', res.output, res.ok);
    toast(res.ok ? '已触发重启' : '重启失败，详见日志', !res.ok);
    await refresh();
  });
}

async function doDelete(name){
  const ok = await confirmModal({
    title: `删除快照「${name}」？`,
    body: '<p>该快照将被永久删除（仅删除本地快照文件，不影响当前登录态）。</p>',
    okText: '删除'
  });
  if(!ok) return;
  const res = await api('/api/delete', {name});
  addLog(`delete ${name}`, res.output, res.ok);
  toast(res.ok ? `已删除「${name}」` : '删除失败，详见日志', !res.ok);
  if(res.ok) await refresh();
}

async function withBusy(btn, fn){
  if(btn){ btn.disabled = true; btn.dataset.t = btn.textContent; btn.innerHTML = '<span class="busy"></span>执行中…'; }
  try{ await fn(); }
  catch(e){ toast('请求失败：' + e.message, true); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = btn.dataset.t; } }
}

/* ---------- profile switch ---------- */
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]');
  if(!b || b.dataset.p === PROFILE) return;
  PROFILE = b.dataset.p;
  [...$('seg').children].forEach(x => x.classList.toggle('on', x.dataset.p === PROFILE));
  refresh();
});
// 支持 ?profile=intl 直达指定 Profile
(() => {
  const q = new URLSearchParams(location.search).get('profile');
  if(q === 'cn' || q === 'intl'){ PROFILE = q; }
})();
[...$('seg').children].forEach(x => x.classList.toggle('on', x.dataset.p === PROFILE));

refresh();
</script>
</body>
</html>
