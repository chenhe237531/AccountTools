<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AccountTools</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0e14; color: #7c8aa0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
  }
  .logo {
    width: 84px; height: 84px; border-radius: 20px;
    background: linear-gradient(135deg, #1d4ed8, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(59, 92, 242, .35);
  }
  .logo .bars { display: flex; flex-direction: column; gap: 7px; align-items: center; }
  .logo .bars i { display: block; height: 8px; border-radius: 4px; background: #fff; }
  .logo .bars i:nth-child(1) { width: 34px; }
  .logo .bars i:nth-child(2) { width: 46px; }
  .logo .bars i:nth-child(3) { width: 58px; }
  h1 { font-size: 15px; color: #dbe4f0; font-weight: 600; margin: 0; }
  p { font-size: 12.5px; margin: 0; }
  .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #1f2a3d; border-top-color: #3b82f6;
    animation: r .8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo"><div class="bars"><i></i><i></i><i></i></div></div>
  <h1>AccountTools</h1>
  <div class="spin"></div>
  <p>正在启动本地服务…</p>
</body>
</html>
